    <script>
      // Ensure deferred CSS loads after critical path
      (function() {
        var cssLinks = document.querySelectorAll('link[media="print"]');
        function loadDeferredCSS() {
          cssLinks.forEach(function(link) {
            link.media = 'all';
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadDeferredCSS);
        } else {
          loadDeferredCSS();
        }
      })();
    </script>

    <!-- Defer non-critical CSS to prevent render blocking -->
    <script>
      // Load main CSS after critical rendering path
      function loadCSS(href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      }
      
      // Defer main CSS loading
      if (typeof window !== 'undefined') {
        window.addEventListener('load', function() {
          // Main CSS is already loaded by Vite, this ensures fonts load properly
          setTimeout(function() {
            var fontLinks = document.querySelectorAll('link[href*="fonts.googleapis.com"]');
            fontLinks.forEach(function(link) {
              if (link.media === 'print') {
                link.media = 'all';
              }
            });
          }, 0);
        });
      }
    </script>
