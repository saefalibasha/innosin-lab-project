    <!-- Immediate URL cleanup script -->
    <script>
      // Clean tracking parameters immediately when page loads
      (function() {
        const url = new URL(window.location.href);
        let needsRedirect = false;
        
        // Remove tracking parameters that appear in Google search results
        const trackingParams = ['srsltid', 'utm_source', 'utm_medium', 'utm_campaign', 'fbclid', 'gclid', 'ref'];
        trackingParams.forEach(param => {
          if (url.searchParams.has(param)) {
            url.searchParams.delete(param);
            needsRedirect = true;
          }
        });
        
        // Redirect to clean URL if tracking parameters were found
        if (needsRedirect) {
          const cleanUrl = url.toString();
          window.history.replaceState({}, document.title, cleanUrl);
          
          // Update canonical URL
          const canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) {
            canonical.href = cleanUrl;
          }
        }
      })();
    </script>

    <!-- Error handling and mount watchdog -->
    <script>
      console.log('🚀 Innosin app starting...');
      
      // Global error handlers
      window.addEventListener('error', function(e) {
        console.error('⚠️ Startup error:', e.error);
        document.getElementById('root').innerHTML = 
          '<div style="padding: 20px; font-family: system-ui; color: #e11d48; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; margin: 20px; max-width: 600px;"><h3>Application Error</h3><p>Error: ' + e.message + '</p><p>File: ' + e.filename + '</p><button onclick="location.reload()" style="background: #e11d48; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Reload App</button></div>';
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error('⚠️ Unhandled promise rejection:', e.reason);
      });
      
      // Mount watchdog softened: log only, do not override root to avoid false positives on slow networks
      setTimeout(function() {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.warn('⚠️ React taking longer than usual to mount');
        }
      }, 15000);
    </script>

    <!-- Disable Service Worker and clear caches to prevent stale chunks -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) { await reg.unregister(); }
            if (window.caches && caches.keys) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
            console.log('SW disabled and caches cleared');
            if (navigator.serviceWorker.controller) {
              setTimeout(() => window.location.reload(), 50);
            }
          } catch (err) {
            console.log('SW cleanup error:', err);
          }
        });
      }
    </script>
    
    <!-- Runtime guard: auto-recover from dynamic import failures -->
    <script>
      (function(){
        const RELOAD_FLAG = 'vite_chunk_reload_once';
        function shouldReload(reason){
          const msg = String(reason && (reason.message || reason)).toLowerCase();
          return (
            msg.includes('failed to fetch dynamically imported module') ||
            msg.includes('importing a module script failed') ||
            msg.includes('loading chunk') ||
            msg.includes('chunk load error') ||
            msg.includes('unexpected token')
          );
        }
        window.addEventListener('error', function(e){
          if (shouldReload(e.error || e.message)) {
            if (!sessionStorage.getItem(RELOAD_FLAG)) {
              sessionStorage.setItem(RELOAD_FLAG, '1');
              location.reload();
            } else {
              sessionStorage.removeItem(RELOAD_FLAG);
            }
          }
        });
        window.addEventListener('unhandledrejection', function(e){
          if (shouldReload(e.reason)) {
            if (!sessionStorage.getItem(RELOAD_FLAG)) {
              sessionStorage.setItem(RELOAD_FLAG, '1');
              location.reload();
            } else {
              sessionStorage.removeItem(RELOAD_FLAG);
            }
          }
        });
      })();
    </script>
